name: CI/CD Pipeline - Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mohammadkaif93
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mohammadkaif93/portfolio:latest
            mohammadkaif93/portfolio:${{ github.sha }}

      - name: Trigger Render Deployment
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d9rf0b8n74is73emqsc0?key=edvdNAWy0zI"